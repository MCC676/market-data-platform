spring:
  application:
    name: market-data-platform

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,dataFreshness
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Energy market data platform (portfolio project)
    version: 0.0.1

mdp:
  data:
    freshness:
      threshold: 60m
      watermark-path: ${MDP_SILVER_WATERMARK:../pipeline/warehouse/_watermarks/shipments.json}
      watermark-poll: 30s
    quality:
      report-path: ${MDP_QUALITY_REPORT:../pipeline/warehouse/_quality/latest.json}
      report-poll: 30s
