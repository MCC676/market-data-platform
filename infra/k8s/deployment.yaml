apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdp-service
  namespace: mdp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mdp-service
  template:
    metadata:
      labels:
        app: mdp-service
    spec:
      containers:
        - name: mdp-service
          image: market-data-platform:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MDP_DATA_FRESHNESS_THRESHOLD
              value: 60m
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
