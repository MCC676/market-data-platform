apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mdp-alerts
  namespace: mdp
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: mdp-service
      rules:
        - alert: MdpServiceDown
          expr: up{job="mdp-service"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: MDP service is not scrapeable
            description: Prometheus cannot scrape {{ $labels.instance }} for more than 1 minute.

        - alert: MdpDataStale
          expr: mdp_data_lag_seconds{job="mdp-service"} > 3600
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Shipment data is stale
            description: No successful ingestion for {{ $value | humanizeDuration }} (threshold 1h).

        - alert: MdpQualityRejectedRows
          expr: mdp_quality_rejected_rows{job="mdp-service"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Pipeline rejected rows for a missing id
            description: The last run rejected {{ $value }} row(s); inspect pipeline/warehouse/_quality/latest.json.

        - alert: MdpQualityInvalidStatus
          expr: mdp_quality_invalid_status_rows{job="mdp-service"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Pipeline found an unknown shipment status
            description: The last run excluded {{ $value }} row(s) with a status outside the allowed set.

        - alert: MdpQualityEmptySilver
          expr: |
            (mdp_quality_silver_rows{job="mdp-service"} == 0)
            and
            (time() - mdp_quality_report_timestamp_seconds{job="mdp-service"} < 3600)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Silver table is empty after a recent run
            description: A quality report was produced in the last hour but silver has 0 rows.

        - alert: MdpHighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{job="mdp-service",status=~"5..",uri!~"/actuator/.*"}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count{job="mdp-service",uri!~"/actuator/.*"}[5m])), 0.001)
            > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: HTTP 5xx error rate above 5%
            description: More than 5% of requests failed in the last 5 minutes.
